# games247 Windows build.
#
# Builds the x64 Windows version and packages the NSIS installer on GitHub's Windows machines.
# - Every push and pull request: build and upload the installer as a workflow artifact.
# - Tags named v* (for example v4.0.0-beta.1): also publish a GitHub release with the installer.
#
# Code signing is not set up yet. When it is, sign games247.exe and the installer in the
# "Sign" step below, before they're uploaded.

name: Windows build

on:
  push:
    branches: [games247]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# A newer push to the same branch cancels an older build that's still running.
# Tag builds (releases) are never cancelled.
concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 150

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # ES-DE's dependency setup launches the OpenSSL installer interactively if OpenSSL is
      # missing. Install it silently first so the script skips that step.
      - name: Install OpenSSL
        shell: pwsh
        # slproweb.com removes old installers, so look up the newest OpenSSL 4.0.x from its
        # published list and verify the download's SHA-256 before running it.
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path "C:\Program Files\OpenSSL-Win64\libcrypto-4-x64.dll")) {
            $list = Invoke-RestMethod https://raw.githubusercontent.com/slproweb/opensslhashes/master/win32_openssl_hashes.json
            $latest = $list.files.PSObject.Properties |
              Where-Object { $_.Name -match '^Win64OpenSSL_Light-4_0_(\d+)\.exe$' } |
              Sort-Object { [int]($_.Name -replace '^Win64OpenSSL_Light-4_0_(\d+)\.exe$', '$1') } |
              Select-Object -Last 1
            if (-not $latest) { throw "No OpenSSL 4.0.x installer found" }
            Write-Host "Installing $($latest.Name)"
            $installer = "$env:RUNNER_TEMP\$($latest.Name)"
            Invoke-WebRequest -Uri $latest.Value.url -OutFile $installer
            $hash = (Get-FileHash $installer -Algorithm SHA256).Hash
            if ($hash -ne $latest.Value.sha256.ToUpper()) { throw "OpenSSL installer checksum mismatch" }
            Start-Process -Wait -FilePath $installer -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-"
          }
          if (-not (Test-Path "C:\Program Files\OpenSSL-Win64\libcrypto-4-x64.dll")) { throw "OpenSSL install failed" }

      # The dependencies take a long time to build (ICU especially), so cache them. The cache
      # is rebuilt whenever either dependency script changes.
      - name: Restore dependency cache
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            external
            *.dll
            *.lib
            es-pdf-converter/*.dll
          key: windows-deps-${{ hashFiles('tools/Windows_dependencies_setup.bat', 'tools/Windows_dependencies_build.bat') }}

      - name: Set up and build dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          call tools\Windows_dependencies_setup.bat || exit /b 1
          call tools\Windows_dependencies_build.bat || exit /b 1

      # Save straight away, so a later failed step doesn't lose the slow dependency build.
      - name: Save dependency cache
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            external
            *.dll
            *.lib
            es-pdf-converter/*.dll
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      - name: Build games247
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release . || exit /b 1
          cmake --build . --parallel || exit /b 1

      - name: Sign
        shell: pwsh
        run: |
          Write-Host "Code signing is not set up yet; the installer is unsigned."

      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis --no-progress -y
          }
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) { throw "NSIS install failed" }

      - name: Package installer
        shell: cmd
        run: |
          set PATH=%ProgramFiles(x86)%\NSIS;%PATH%
          cpack -G NSIS || exit /b 1
          dir *.exe

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: games247-windows-installer
          path: games247_*-x64.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installer = Get-ChildItem games247_*-x64.exe | Select-Object -First 1
          $prerelease = if ("${{ github.ref_name }}" -match "-") { "--prerelease" } else { "" }
          gh release create "${{ github.ref_name }}" $installer.FullName --title "games247 ${{ github.ref_name }}" --generate-notes $prerelease
